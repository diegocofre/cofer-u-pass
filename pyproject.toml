[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cofer-u-pass"
version = "1.2.2"
description = "Local, agent-independent automation layer for authenticated AI web applications"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Diego Cofre" }]
keywords = ["playwright", "automation", "chatgpt", "gemini", "deepseek", "sse"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "fastapi>=0.115,<1",
  "platformdirs>=4,<5",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "playwright>=1.50,<2",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
]

[project.scripts]
cofer-u-pass = "cofer_u_pass.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cofer_u_pass = [
  "adapters/*/rules.json",
  "adapters/*/manifest.json",
  "_bundled_schemas/*.json",
  "_bundled_examples/*"
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: controlled Chromium integration tests", "smoke: supervised live-provider tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
