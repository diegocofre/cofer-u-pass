protocol_id: ask-with-files
version: 1.0.0
engine_contract: "1.0"
required_capabilities:
  - conversation.new
  - attachment.upload
  - message.send
  - response.stream
input_schema:
  type: object
  additionalProperties: false
  required: [prompt, files]
  properties:
    prompt: {type: string, minLength: 1}
    files:
      type: array
      minItems: 1
      items: {type: string, minLength: 1}
operations:
  - type: open_conversation
  - type: attach_files
    params:
      files: "${input.files}"
  - type: send_message
    params:
      text: "${input.prompt}"
  - type: capture_response
    timeout_seconds: 240
  - type: download_artifacts
  - type: finalize
output_contract:
  canonical: canonical-block-v1
