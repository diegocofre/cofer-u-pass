protocol_id: ask
version: 1.0.0
engine_contract: "1.0"
required_capabilities:
  - conversation.new
  - message.send
  - response.stream
input_schema:
  type: object
  additionalProperties: false
  required: [prompt]
  properties:
    prompt:
      type: string
      minLength: 1
operations:
  - type: open_conversation
  - type: send_message
    params:
      text: "${input.prompt}"
  - type: capture_response
    timeout_seconds: 180
  - type: checkpoint
  - type: finalize
output_contract:
  canonical: canonical-block-v1
